name: Scientific reproducibility - full simulations
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scientific-reproducibility
  cancel-in-progress: false
jobs:
  scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific and analysis packages
        run: python -m pip install -e '.[analysis]' matplotlib
      - name: Run all scientific gates, with per-command logs
        run: python scripts/automation/run_pipeline.py --profile science --run-id science-${{ github.run_id }}
      - name: Archive scientific reports (not an external hardware validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-logs-${{ github.run_id }}
          path: logs/runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive generated simulator numerical results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: science-results-${{ github.run_id }}
          path: |
            outputs/architecture_study/
            outputs/stim_memory/
            outputs/literature_benchmark/
            outputs/idle_coherence/
            outputs/controller_capacity/
          retention-days: 90
          if-no-files-found: error
