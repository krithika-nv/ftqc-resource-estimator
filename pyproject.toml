[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftqc-resource-estimator"
version = "1.13.0"
description = "Reproducible, assumption-driven FTQC architecture tradeoff and reliability sensitivity analysis prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["stim>=1.15,<2", "pymatching>=2.3,<3", "numpy>=1.26", "openpyxl>=3.1", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
